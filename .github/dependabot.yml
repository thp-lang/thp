version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /doc
    schedule:
      interval: weekly
    groups:
      documentation-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

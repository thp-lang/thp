[workspace]
members = [
    "crates/abi",
    "crates/bytecode",
    "crates/cli",
    "crates/compiler",
    "crates/config",
    "crates/diagnostics",
    "crates/hir",
    "crates/embed",
    "crates/jit",
    "crates/metrics",
    "crates/mir",
    "crates/modules",
    "crates/opcache",
    "crates/runtime",
    "crates/syntax",
    "crates/test",
    "crates/vm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1.8.7"
cranelift-codegen = "0.125.4"
cranelift-frontend = "0.125.4"
cranelift-jit = "0.125.4"
cranelift-module = "0.125.4"
cranelift-native = "0.125.4"
serde = { version = "1.0.219", features = ["derive"] }
regex = "1.11.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "1.1.4"

[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
